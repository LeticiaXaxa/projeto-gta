<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Game GTA VI</title>
</head>

<body>
    <p class="nome">Lucia</p>

    <img class="personagem" src="img/lucia.png">

    <div class="textos">

        <p class="etiqueta">Selecione o seu personagem</p>
        <h1>Não é só<br>um jogo</h1>
        <p class="apoio">Escolha uma lenda de Dev City, ou tire uma selfie e vire uma!</p>

    </div>


    <div class="menu">


        <img onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3cac')" class="avatar" src="img/lucia.png">



        <img onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')" class="avatar" src="img/jason.png">


        <img onclick="escolherPersonagem('CJ', 'img/cj.png', '#7ed37e')"class="avatar" src="img/cj.png">


        <label class="voce">📸 
            <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
        </label>

    </div>

</body>

<script src="https://js.puter.com/v2/"></script>

<script src="script.js"></script>

</html>
